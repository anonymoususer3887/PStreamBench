---
- name: Start RisingWave meta + frontend on the master node
  hosts: alpha
  gather_facts: yes
  become: True
  become_method: sudo
  tasks:
    - include_tasks: "tasks/risingwave/complex/risingwave-minio-start.yaml"
      tags:
        - "risingwave-start"
    - include_tasks: "tasks/risingwave/complex/risingwave-meta-start.yaml"
      tags:
        - "risingwave-start"
    - include_tasks: "tasks/risingwave/complex/risingwave-frontend-start.yaml"
      tags:
        - "risingwave-start"
    - include_tasks: "tasks/prometheus/prometheus-start.yaml"
      tags:
        - "prometheus-start"
    - include_tasks: "tasks/grafana/grafana-start.yaml"
      tags:
        - "grafana-start"

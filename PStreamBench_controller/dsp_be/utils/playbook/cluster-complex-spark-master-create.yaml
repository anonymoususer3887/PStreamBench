---
- name: Install and start Spark master in a node
  hosts: alpha
  gather_facts: yes
  become: True
  become_method: sudo
  tasks:
    - include_tasks: "tasks/spark/complex/spark-config-setup.yaml"
      tags:
        - "spark-config-setup"
    - include_tasks: "tasks/spark/complex/spark-master-start.yaml"
      tags:
        - "spark-start"
    - include_tasks: "tasks/prometheus/prometheus-config-setup.yaml"
      tags:
        - "prometheus-config-setup"
    - include_tasks: "tasks/prometheus/prometheus-start.yaml"
      tags:
        - "prometheus-start"
    - include_tasks: "tasks/grafana/grafana-unzip.yaml"
      tags:
        - "grafana-unzip"
    - include_tasks: "tasks/grafana/grafana-start.yaml"
      tags:
        - "grafana-start"

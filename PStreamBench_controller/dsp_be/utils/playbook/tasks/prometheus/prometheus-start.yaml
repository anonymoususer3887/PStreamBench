- name: Start Prometheus.
  shell: "nohup sudo {{ INSTALLATION_DIR }}/prometheus-2.42.0.linux-amd64/prometheus --storage.tsdb.path={{ INSTALLATION_DIR }}/prometheus-2.42.0.linux-amd64/data --config.file={{ INSTALLATION_DIR }}/prometheus-2.42.0.linux-amd64/prometheus.yml >> {{ INSTALLATION_DIR }}/prometheus.log 2>&1 &"
  ignore_errors: true
  timeout: 10
  tags:
    - start

---
# See risingwave-meta-stop.yaml's comment for why the pattern is
# '[r]isingwave frontend', not 'risingwave frontend' -- without the
# bracket, pkill -f self-matches its own invoking command line and kills
# itself before it can signal the real process.
- name: Stop RisingWave frontend node
  shell: "pkill -f '[r]isingwave frontend' || true"

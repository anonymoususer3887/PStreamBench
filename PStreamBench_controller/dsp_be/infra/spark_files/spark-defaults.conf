# Templated by infra/views.py::_spark_config_manipulation() (placeholders
# below are substituted before this file is copied to the cluster), mirroring
# how sample-flink-conf.yaml / flink-conf.yaml are handled for Flink.

spark.master                     spark://ms1122:7077

# Native Prometheus metrics (Spark 3.x), scraped the same way Flink's
# PrometheusReporter output is scraped -- see _prometheus_config_manipulation().
spark.ui.prometheus.enabled                              true
spark.metrics.conf.*.sink.prometheusServlet.class         org.apache.spark.metrics.sink.PrometheusServlet
spark.metrics.conf.*.sink.prometheusServlet.path          /metrics/prometheus
spark.metrics.conf.master.sink.prometheusServlet.path      /metrics/master/prometheus
spark.metrics.conf.applications.sink.prometheusServlet.path /metrics/applications/prometheus

# Structured Streaming default shuffle-partition count. Overridden per job at
# runtime (spark.conf().set(...) in WordCountJob) for the "counter" stage;
# this is just the cluster-wide default for stages that do not set it.
spark.sql.shuffle.partitions     40

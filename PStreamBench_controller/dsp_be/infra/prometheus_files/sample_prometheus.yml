# my global config
global:
  scrape_interval: 1s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 1s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
#alerting:
#  alertmanagers:
#    - static_configs:
#        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
#rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "jobmanager"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: ["localhost:9250"]

  - job_name: "taskmanager"
    static_configs:
      - targets: ["pc546.emulab.net:9250"]

  - job_name: "kafka"
    static_configs:
      - targets: ["localhost:7075"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["pc546.emulab.net:9100"]

  - job_name: "push_gateway"
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: "storm_exporter"
    static_configs:
      - targets: ["localhost:9093"]

  # Spark driver's built-in PrometheusServlet (spark.metrics.conf +
  # spark.sql.streaming.metricsEnabled=true, set on the shared spark-submit
  # command in spark-provide-job.yaml). The driver always runs in client mode
  # on the master itself, so this is a fixed localhost target -- it's simply
  # "down" whenever no Spark job is currently running.
  - job_name: "spark_driver"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["localhost:4040"]

  # Kafka Streams' own JMX metrics (kafka.streams:*), exposed via the same
  # jmx_prometheus_javaagent attached to the app's `java` command line (see
  # kafkastreams-provide-job.yaml), on a port distinct from the Kafka
  # broker's own JMX exporter (7075) since both run on the same nodes.
  # Unlike Spark's single driver target, one Kafka Streams instance runs per
  # worker node (see KAFKA_STREAMS_RISINGWAVE_PLAN.md Part A.1), so targets
  # are populated per-node, not a fixed localhost -- see
  # _prometheus_config_manipulation().
  - job_name: "kafkastreams_app"
    static_configs:
      - targets: []

  # RisingWave's own metrics endpoints -- one compute node per worker node
  # (:1222) plus the master's fused meta+frontend endpoints (:1250 for meta,
  # :2222 for frontend), per KAFKA_STREAMS_RISINGWAVE_PLAN.md Part B.1.
  # Populated per-node the same way kafkastreams_app_nodes is, since there's
  # one compute-node process per worker rather than a single fixed target --
  # see _prometheus_config_manipulation().
  - job_name: "risingwave"
    static_configs:
      - targets: []

global: {scrape_interval: 1s, evaluation_interval: 1s}
scrape_configs:
- job_name: jobmanager
  static_configs:
  - targets: ['localhost:9250']
- job_name: taskmanager
  static_configs:
  - targets: ['ms0837.utah.cloudlab.us:9250', 'ms0812.utah.cloudlab.us:9250', 'ms0838.utah.cloudlab.us:9250',
      'ms0805.utah.cloudlab.us:9250', 'ms0802.utah.cloudlab.us:9250']
- job_name: kafka
  static_configs:

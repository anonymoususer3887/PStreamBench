global: {scrape_interval: 1s, evaluation_interval: 1s}
scrape_configs:
- job_name: jobmanager
  static_configs:
  - targets: ['localhost:9250']
- job_name: taskmanager
  static_configs:
  - targets: ['ms1310.utah.cloudlab.us:9250', 'ms1137.utah.cloudlab.us:9250', 'ms1126.utah.cloudlab.us:9250',
      'ms1317.utah.cloudlab.us:9250', 'ms1118.utah.cloudlab.us:9250']
- job_name: kafka
  static_configs:
  - targets: ['localhost:7075', 'ms1310:7075', 'ms1137:7075', 'ms1126:7075', 'ms1317:7075',
      'ms1118:7075']
- job_name: node_exporter
  static_configs:
  - targets: ['ms1310.utah.cloudlab.us:9100', 'ms1137.utah.cloudlab.us:9100', 'ms1126.utah.cloudlab.us:9100',
      'ms1317.utah.cloudlab.us:9100', 'ms1118.utah.cloudlab.us:9100']
- job_name: push_gateway
  static_configs:
  - targets: ['localhost:9091']
- job_name: storm_exporter
  static_configs:
  - targets: ['localhost:9093']
- job_name: spark_driver
  metrics_path: /metrics/prometheus/
  static_configs:
  - targets: ['ms1122:4040']
